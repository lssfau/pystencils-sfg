[project]
name = "pystencilssfg"
description = "pystencils Source File Generator"
authors = [
    {name = "Frederik Hennig", email = "frederik.hennig@fau.de"},
]
dependencies = [
    "pystencils>=2.0b1",
]
requires-python = ">=3.10"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dynamic = ["version"]

[project.urls]
"Homepage" = "https://pycodegen.pages.i10git.cs.fau.de"
"Documentation" = "https://pycodegen.pages.i10git.cs.fau.de/pystencils-sfg/"
"Source Code" = "https://i10git.cs.fau.de/pycodegen/pystencils-sfg"

[project.scripts]
sfg-cli = "pystencilssfg.cli:cli_main"

[build-system]
requires = [
    "setuptools>=69",
    "versioneer[toml]>=0.29",
]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
    "flake8",
    "mypy",
    "black",
    "clang-format",
]
testsuite = [
    "pytest",
    "pytest-cov~=7.0",
    "pyyaml",
    "requests",
    "fasteners",
]
docs = [
    "sphinx",
    "pydata-sphinx-theme==0.15.4",
    "sphinx-book-theme==1.1.3",  # workaround for https://github.com/executablebooks/sphinx-book-theme/issues/865
    "myst-nb",
    "sphinx_design",
    "sphinx_autodoc_typehints",
    "sphinx-copybutton",
    "packaging",
    "clang-format"
]

[tool.versioneer]
VCS = "git"
style = "pep440"
versionfile_source = "src/pystencilssfg/_version.py"
versionfile_build = "pystencilssfg/_version.py"
tag_prefix = "v"
parentdir_prefix = "pystencilssfg-"

[tool.coverage.run]
patch = ["subprocess"]
omit = [
    "setup.py",
    "noxfile.py",
    "**/_version.py",
    "integration/*"
]

[tool.coverage.report]
exclude_also = [
    "\\.\\.\\.\n",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
    "assert False"
]
